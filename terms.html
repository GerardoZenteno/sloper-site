<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms of Service | Sloper</title>
    <!-- Tailwind CSS v3 CDN with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-deep": "#F6F6F6",
                        "surface-container": "#FFFFFF",
                        "surface-container-low": "#FFFFFF",
                        "surface-container-lowest": "#FFFFFF",
                        "surface-container-high": "#FFFFFF",
                        "surface-container-highest": "#E5E7EB",
                        "surface-elevated": "#FFFFFF",
                        "primary": "#4583E2",
                        "primary-blue": "#4583E2",
                        "accent-gold": "#B45309",
                        "tertiary": "#059669",
                        "navy-border": "#E5E7EB",
                        "on-surface": "#111827",
                        "on-surface-variant": "#4B5563",
                        "outline": "#9CA3AF",
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'Roboto', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                        body: ['Roboto', 'sans-serif'],
                        fredoka: ['Fredoka', 'sans-serif'],
                    }
                },
            },
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Montserrat:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700&family=Grandstander:wght@900&display=swap" rel="stylesheet">
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .primary {
            color: #4583E2 !important;
        }
        a.primary[href*="download"], button.primary {
            background-color: #4583E2 !important;
            color: #FFFFFF !important;
        }
        .font-grandstander, .titles {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
        }
        .font-fredoka {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-[#F6F6F6] text-[#111827] font-body selection:bg-black selection:text-white antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <nav class="sticky top-0 z-50 bg-[#F6F6F6]/90 backdrop-blur-md border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <!-- Brand Logo -->
            <a href="/" class="font-fredoka font-bold text-2xl tracking-tight !text-black hover:opacity-90 transition-opacity" style="color: #000000 !important;">
                SLOPER
            </a>

            <!-- Desktop Nav Menu -->
            <div class="hidden md:flex items-center gap-8">
                <a href="/#features" class="text-sm font-medium text-gray-600 hover:text-black transition-colors">Board</a>
                <a href="/#chests" class="text-sm font-medium text-gray-600 hover:text-black transition-colors">Route</a>
                <a href="/#boost" class="text-sm font-medium text-gray-600 hover:text-black transition-colors">Gym</a>
                
                <!-- Download CTA -->
                <a href="/#download" class="titles primary bg-primary text-white text-sm px-5 py-2 rounded-lg hover:bg-neutral-800 transition-all shadow-md">
                    Download
                </a>
            </div>

            <!-- Mobile Controls -->
            <div class="flex md:hidden items-center gap-3">
                <button id="mobile-menu-btn" class="material-symbols-outlined primary text-3xl p-1 focus:outline-none text-black">
                    menu
                </button>
            </div>
        </div>

        <!-- Mobile Dropdown Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-gray-200 px-6 py-4 space-y-3">
            <a href="/#features" class="block text-sm font-medium text-gray-700 hover:text-black">Board</a>
            <a href="/#chests" class="block text-sm font-medium text-gray-700 hover:text-black">Route</a>
            <a href="/#boost" class="block text-sm font-medium text-gray-700 hover:text-black">Gym</a>
            <a href="/#download" class="titles primary block text-center bg-primary text-white text-sm px-4 py-2.5 rounded-lg shadow-sm">Download App</a>
        </div>
    </nav>

    <!-- Content Shell -->
    <main class="max-w-4xl mx-auto px-6 py-16 flex-1 w-full">
        <!-- Page Header Card -->
        <div class="bg-white border border-gray-200 rounded-2xl p-8 sm:p-12 shadow-xs">
            <span class="text-xs font-bold uppercase tracking-widest primary">LEGAL AGREEMENT</span>
            <h1 class="titles text-4xl sm:text-5xl text-black mt-2 mb-4">Terms of Service</h1>
            <p class="text-sm text-gray-500">
                Last Updated: <span class="text-black font-medium">September 22, 2026</span>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-12 mt-12">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="space-y-2 text-center md:text-left">
                <a href="/" class="font-fredoka font-bold text-2xl !text-black hover:opacity-90 transition-opacity" style="color: #000000 !important;">SLOPER</a>
                <p class="text-xs text-gray-500">
                    © 2024 <span class="primary font-semibold">Sloper</span>. Not affiliated with any climbing corporation.
                </p>
            </div>
            
            <div class="flex flex-wrap justify-center gap-6 text-xs text-gray-500">
                <a href="/privacypolicy.html" class="hover:text-black transition-colors">Privacy Policy</a>
                <a href="/terms.html" class="primary font-bold text-black border-b-2 border-black pb-0.5">Terms of Service</a>
                <a href="#" class="hover:text-black transition-colors">Support</a>
                <a href="#" class="hover:text-black transition-colors">Tiktok</a>
                <a href="#" class="hover:text-black transition-colors">Discord</a>
            </div>
        </div>
    </footer>

    <!-- Micro-Interactions JavaScript -->
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        if (menuBtn && mobileMenu) {
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
    </script>
</body>
</html>
